[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qkv2x"
version = "0.1.0"
description = "Cross-layer quantum-kernel misbehaviour detection for V2X (SUMO + ns-3 co-simulation)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pennylane>=0.36",
    "torch>=2.2",
    "tqdm>=4.65",
    "xgboost>=2.0",          # SOTA classical baseline (was missing; added earlier)
]

[project.optional-dependencies]
# Hardware / real-QPU runs only (IBM Quantum). NOT needed for the CPU statevector pipeline.
hardware = ["qiskit>=2.0", "qiskit-ibm-runtime>=0.40"]

# NOTE: loose lower bounds above declare API compatibility; for an EXACT reproduction of the
# tested results use the hard pins in requirements.txt / requirements-lock.txt (Python 3.11).
# See REPRODUCE_ENV.md.

[project.scripts]
qkv2x = "qkv2x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

testpaths = ["tests"]
addopts = "-q"
