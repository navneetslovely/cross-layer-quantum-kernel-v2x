# Co-simulation sweep for the ATTACK-INTENSITY study — DRIFT family.
# Second magnitude-axis attack alongside intensity_offset.
# One axis: drift_speed — the rate [m/s] at which the attacker's CLAIMED position drifts
# away from its true trajectory. Single-attack mix (drift only) so every run differs ONLY
# in the drift rate; detectability should rise with the rate (slow drift is stealthy, fast
# drift is kinematically implausible). Mirrors intensity_offset.yaml exactly except for the
# swept axis + single-attack mix, so the two intensity curves are directly comparable.
# CPU-friendly: 5 intensities x 2 seeds = 10 short runs at a fixed density.
scenario:
  name: intensity_drift
  sumocfg: cosim/sumo/scenarios/dev_grid/dev_grid.sumocfg
  step_length: 0.1
  warmup: 30.0
  duration: 240.0

out_root: runs/intensity_drift
seeds: [1, 2]
node_pool: 600

rsu:
  count: 9
  margin: 100.0
  z: 6.0

sweep:
  drift_speed: [0.5, 1.0, 2.0, 4.0, 8.0]   # the attack-intensity axis: drift rate [m/s]

channel:
  path_loss_exponent: 2.75
  ref_loss_db: 47.86
  ref_distance: 1.0
  shadowing_sigma_db: 3.0
  shadowing_tau_s: 1.0
  nakagami: false
  rx_sensitivity_dbm: -94.0
  cca_threshold_dbm: -84.0
  tx_power_dbm: 20.0
  datarate: OfdmRate6MbpsBW10MHz

bsm:
  rate_hz: 10.0
  size_bytes: 300

attacks:
  fraction: 0.30
  onset_uniform: [10.0, 60.0]
  mix:
    drift: 1                   # the ONLY attack — its drift rate is swept above
  params:
    # drift_speed is overridden per-run by the sweep axis above.
    drift_speed: 2.0

ns3:
  run_via_wrapper: true
n_jobs: 5
sumo_binary: sumo
