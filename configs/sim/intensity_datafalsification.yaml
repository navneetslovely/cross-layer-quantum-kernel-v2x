# Co-simulation sweep for the ATTACK-INTENSITY study — DATA-FALSIFICATION family.
# Third magnitude-axis attack alongside intensity_offset/drift.
# One axis: data_fals_heading_jitter — the amplitude [deg] of the jitter the attacker injects
# into its CLAIMED heading/motion. Single-attack mix (data_falsification only) so every run
# differs ONLY in the jitter amplitude; detectability should rise with it (small jitter is
# benign-like and stealthy, large jitter is internally inconsistent and detectable). Mirrors
# intensity_offset.yaml exactly except for the swept axis + single-attack mix.
# CPU-friendly: 5 intensities x 2 seeds = 10 short runs at a fixed density.
scenario:
  name: intensity_datafalsification
  sumocfg: cosim/sumo/scenarios/dev_grid/dev_grid.sumocfg
  step_length: 0.1
  warmup: 30.0
  duration: 240.0

out_root: runs/intensity_datafalsification
seeds: [1, 2]
node_pool: 600

rsu:
  count: 9
  margin: 100.0
  z: 6.0

sweep:
  data_fals_heading_jitter: [5.0, 15.0, 30.0, 60.0, 120.0]   # heading-jitter amplitude [deg]

channel:
  path_loss_exponent: 2.75
  ref_loss_db: 47.86
  ref_distance: 1.0
  shadowing_sigma_db: 3.0
  shadowing_tau_s: 1.0
  nakagami: false
  rx_sensitivity_dbm: -94.0
  cca_threshold_dbm: -84.0
  tx_power_dbm: 20.0
  datarate: OfdmRate6MbpsBW10MHz

bsm:
  rate_hz: 10.0
  size_bytes: 300

attacks:
  fraction: 0.30
  onset_uniform: [10.0, 60.0]
  mix:
    data_falsification: 1      # the ONLY attack — its heading-jitter amplitude is swept above
  params:
    # data_fals_heading_jitter is overridden per-run by the sweep axis above.
    data_fals_speed_min: 0.0
    data_fals_speed_max: 2.5
    data_fals_heading_jitter: 60.0

ns3:
  run_via_wrapper: true
n_jobs: 5
sumo_binary: sumo
