# earlier: dedicated tamed-flooding (DoS) side-study. Flooding was dropped from the core
# dev_grid mix because at 10x rate it DoS-congests the channel + explodes window
# counts. Here it is studied on its own at a TAMED factor (2x) as a flooding-vs-benign
# detection task: can the detector flag a DoS flooder via its rate/PDR signature?
scenario:
  name: dev_grid_flooding
  sumocfg: cosim/sumo/scenarios/dev_grid/dev_grid.sumocfg
  step_length: 0.1
  warmup: 30.0
  duration: 200.0

out_root: runs/dev_grid_flooding
seeds: [1, 2]
node_pool: 1000

rsu:
  count: 9
  margin: 100.0
  z: 6.0

sweep:
  density_scale: [0.5, 1.0]      # two congestion levels (flooding x density is the DoS axis)
  tx_power_dbm: [20.0]
  shadowing_sigma_db: [3.0]

channel:
  path_loss_exponent: 2.75
  ref_loss_db: 47.86
  ref_distance: 1.0
  shadowing_sigma_db: 3.0
  shadowing_tau_s: 1.0
  nakagami: false
  rx_sensitivity_dbm: -94.0
  cca_threshold_dbm: -84.0
  tx_power_dbm: 20.0
  datarate: OfdmRate6MbpsBW10MHz

bsm:
  rate_hz: 10.0
  size_bytes: 300

attacks:
  fraction: 0.30                 # 30% of vehicles are flooders, 70% benign
  onset_uniform: [10.0, 40.0]
  mix:
    flooding: 1                  # flooding ONLY (the DoS attack under study)
  params:
    flooding_factor: 2.0         # TAMED rate (2x nominal, not the 10x that congested core dev_grid)

ns3:
  run_via_wrapper: true
n_jobs: 4
sumo_binary: sumo
