# Co-simulation sweep for the ATTACK-INTENSITY study.
# One axis: const_offset_m — the magnitude of the constant position offset, in metres.
# Single-attack mix (const_offset only) so every run differs ONLY in how far the
# attacker displaces its claimed position; detectability should rise with the offset.
# CPU-friendly: 5 intensities x 2 seeds = 10 short runs at a fixed density.
scenario:
  name: intensity_offset
  sumocfg: cosim/sumo/scenarios/dev_grid/dev_grid.sumocfg
  step_length: 0.1
  warmup: 30.0
  duration: 240.0

out_root: runs/intensity_offset
seeds: [1, 2]
node_pool: 600

rsu:
  count: 9
  margin: 100.0
  z: 6.0

sweep:
  const_offset_m: [10.0, 25.0, 50.0, 100.0, 200.0]   # the attack-intensity axis [m]

channel:
  path_loss_exponent: 2.75
  ref_loss_db: 47.86
  ref_distance: 1.0
  shadowing_sigma_db: 3.0
  shadowing_tau_s: 1.0
  nakagami: false
  rx_sensitivity_dbm: -94.0
  cca_threshold_dbm: -84.0
  tx_power_dbm: 20.0
  datarate: OfdmRate6MbpsBW10MHz

bsm:
  rate_hz: 10.0
  size_bytes: 300

attacks:
  fraction: 0.30
  onset_uniform: [10.0, 60.0]
  mix:
    const_offset: 1            # the ONLY attack — its offset magnitude is swept above
  params:
    # const_offset_min/max are overridden by the const_offset_m sweep axis (set equal),
    # giving a single, exact offset magnitude per run.
    const_offset_min: 100.0
    const_offset_max: 100.0

ns3:
  run_via_wrapper: true
n_jobs: 5
sumo_binary: sumo
