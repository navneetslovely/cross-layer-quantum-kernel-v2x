# Attack-intensity sweep — DATA-FALSIFICATION family.
# Measures detectability as the claimed-heading JITTER AMPLITUDE grows.
# Requires the matching co-sim sweep first:
#  python -m qkv2x.cli cosim      --config configs/sim/intensity_datafalsification.yaml
#  python -m qkv2x.cli features   --runs runs/intensity_datafalsification --config configs/features.yaml
#  python -m qkv2x.cli experiment --config configs/experiments/intensity_datafalsification.yaml
kind: intensity
name: intensity_datafalsification
runs_root: runs/intensity_datafalsification
features_config: configs/features.yaml
quantum_config: configs/quantum.yaml
baselines_config: configs/baselines.yaml
out_dir: results/intensity_datafalsification

axis: data_fals_heading_jitter
models: [qsvm_crosslayer, qsvm_zz, rbf_svm, random_forest, rules]
bootstrap: 200

# READOUT: intensity_results.csv has metric ± 95% CI per (intensity, model);
# pr_auc_vs_intensity.png / roc_auc_vs_intensity.png are the headline curves;
# significance.csv tests each quantum model vs rbf_svm at each intensity level.
